version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: cron
      cronjob: "0 9 27 * *"  # 27th: spend the month's remaining Actions budget, not the next
    groups:
      all:
        patterns: ["*"]
    assignees:
      - grimley517
    cooldown:
      default-days: 7
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: cron
      cronjob: "0 9 27 * *"  # 27th: spend the month's remaining Actions budget, not the next
    groups:
      all:
        patterns: ["*"]
    assignees:
      - grimley517
    cooldown:
      default-days: 7
